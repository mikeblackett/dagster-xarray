[project]
name = "dagster-xarray"
version = "0.1.2"
description = "Dagster integration for xarray: IO managers, pandera-backed DagsterTypes, and asset checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mike Blackett", email = "27811528+mikeblackett@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Dagster",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "dagster>=1.13.11",
    "dask[distributed]>=2026.4.0",
    "pandera[xarray]>=0.32.0",
    "universal-pathlib>=0.3.0",
    "xarray[io,parallel]>=2026.4.0",
]

[project.urls]
Repository = "https://github.com/mikeblackett/dagster-xarray"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.0",
    "pytest>=9.1.1",
    "pyright>=1.1.411",
    "ruff>=0.15.20",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.ruff.lint]
extend-ignore = []

