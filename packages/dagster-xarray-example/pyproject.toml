[project]
name = "dagster_xarray_example"
requires-python = ">=3.13,<3.15"
version = "0.1.0"
dependencies = [
    "dagster>=1.13.11",
    "dagster-xarray",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_xarray_example"
registry_modules = [
    "dagster_xarray_example.components.*",
]

[tool.uv.sources]
dagster-xarray = { path = "../../", editable = true }
